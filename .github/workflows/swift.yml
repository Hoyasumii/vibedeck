name: Swift

on:
  push:
    branches: [main]
    paths-ignore: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths-ignore: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Full Xcode toolchain here, so a plain `swift test` builds and links the test bundle
      # (scripts/test.sh is tuned for a local CLT-only setup).
      - run: swift test

  # The CLI and MCP server (no SwiftUI app) must keep building on Linux: Claude Code cloud sessions run there.
  linux-cli:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --product vibedeck
