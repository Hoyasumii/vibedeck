[workspace]
resolver = "3"
members = ["crates/vibedeck-core", "crates/vibedeck"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
